# Keep the Render free-tier backend warm by pinging periodically.
# Without this, Render sleeps the container after 15 min of inactivity, causing
# 15-20 second cold starts for user requests.
#
# We ping /api/menu/today/all to warm both the container AND the in-memory menu cache.

name: Keep Backend Alive

on:
  schedule:
    # Schedule ping backup
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    continue-on-error: true # Never send failure alert emails if Render takes time to wake
    steps:
      - name: Warm up server and menu cache
        run: |
          echo "Pinging Render backend..."
          # Wake up the server with generous timeout for cold starts (up to 90s)
          health=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 30 --max-time 90 \
            --retry 2 --retry-delay 5 \
            "https://mealsync-mess-managment-system.onrender.com/api/health" || echo "timeout")
          echo "Health check result: $health"

          # Warm the menu cache
          menu=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 20 --max-time 45 \
            "https://mealsync-mess-managment-system.onrender.com/api/menu/today/all" || echo "timeout")
          echo "Menu cache warm result: $menu"

          echo "Keep-alive ping completed successfully."
